[package]
name = "typhoon"
version = "0.1.0"
edition = "2024"
description = "Desktop GUI for planning and streaming filament winding G-code (port of cyclone)"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "clipboard",
    "links",
    "persistence",
    "x11",
    "wayland",
] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
libm = "0.2.16"
resvg = { version = "0.50", default-features = false }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Keep debug builds snappy for the UI while iterating.
[profile.dev.package."*"]
opt-level = 2
